name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      AVALONIA_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore StorageVisualiser.slnx

      - name: Run unit tests
        run: dotnet test StorageVisualiser.slnx --configuration Release --no-restore --verbosity normal

      - name: Publish single-file executable (win-x64)
        run: >
          dotnet publish src/StorageVisualiser.App/StorageVisualiser.App.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish/win-x64

      - name: Create release zip archive
        shell: pwsh
        run: |
          Compress-Archive -Path "publish/win-x64/StorageVisualiser.exe", "README.md", "LICENSE", "THIRD-PARTY-NOTICES.md" -DestinationPath "StorageVisualiser-win-x64.zip" -Force

      - name: Compute SHA-256 checksums
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 "StorageVisualiser-win-x64.zip").Hash.ToLower()
          "$hash  StorageVisualiser-win-x64.zip" | Out-File -Encoding utf8 "SHA256SUMS.txt"
          Write-Host "SHA-256: $hash"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            StorageVisualiser-win-x64.zip
            SHA256SUMS.txt
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
